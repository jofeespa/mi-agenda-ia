workflows:
  android-debug:
    name: Mi Agenda IA 0.1.2 - APK auditado
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.38.1
    scripts:
      - name: Mostrar versiones
        script: |
          set -e
          flutter --version
          java -version
          python3 --version

      - name: Validar archivos base
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          required = [
              "pubspec.yaml",
              "analysis_options.yaml",
              "lib/main.dart",
              "lib/screens/home_screen.dart",
              "lib/services/intent_parser.dart",
              "lib/services/notification_service.dart",
              "lib/services/storage_service.dart",
              "test/intent_parser_test.dart",
              "tool/prepare_android.py",
          ]

          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f"Faltan archivos: {missing}")

          yaml.safe_load(Path("pubspec.yaml").read_text())
          yaml.safe_load(Path("codemagic.yaml").read_text())
          print("Archivos YAML y estructura base: OK")
          PY

      - name: Generar y validar Android
        script: |
          set -e
          python3 -m py_compile tool/prepare_android.py
          python3 tool/prepare_android.py
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -q "ScheduledNotificationReceiver" android/app/src/main/AndroidManifest.xml
          grep -q "gradle-8.13-bin.zip" android/gradle/wrapper/gradle-wrapper.properties
          echo "Android: OK"

      - name: Descargar dependencias
        script: |
          set -e
          flutter pub get
          flutter pub deps --style=compact

      - name: Verificar formato
        script: |
          set -e
          dart format --output=none --set-exit-if-changed lib test

      - name: Analizar código
        script: |
          set -e
          flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas
        script: |
          set -e
          flutter test

      - name: Crear APK instalable
        script: |
          set -e
          flutter build apk --debug
          test -f build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk             build/app/outputs/flutter-apk/Mi-Agenda-IA-0.1.2.apk

    artifacts:
      - build/app/outputs/flutter-apk/Mi-Agenda-IA-0.1.2.apk
      - build/app/outputs/flutter-apk/app-debug.apk
