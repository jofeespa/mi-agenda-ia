workflows:
  android-debug:
    name: Mi Agenda IA 0.4.2 - APK de prueba
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.38.1

    scripts:
      - name: Mostrar versiones
        script: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          python3 --version

      - name: Validar estructura base
        script: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f analysis_options.yaml
          test -f lib/main.dart
          test -f lib/models/agenda_item.dart
          test -f lib/models/app_settings.dart
          test -f lib/screens/home_screen.dart
          test -f lib/services/intent_parser.dart
          test -f lib/services/storage_service.dart
          test -f lib/widgets/item_card.dart
          test -f test/intent_parser_test.dart
          test -f tool/prepare_android.py

          grep -q '^name: mi_agenda_ia$' pubspec.yaml
          grep -q '^version: 0.4.2+15$' pubspec.yaml
          grep -q '^description: "Agenda personal por voz:' pubspec.yaml
          python3 -m py_compile tool/prepare_android.py
          echo "Estructura base: OK"

      - name: Generar y validar Android
        script: |
          set -euo pipefail
          python3 tool/prepare_android.py

          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle/wrapper/gradle-wrapper.properties

          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'gradle-8.13-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          test ! -f test/widget_test.dart || { echo "No debe existir test/widget_test.dart generado por Flutter"; exit 1; }
          test -f android/app/src/main/kotlin/com/miagendaia/mi_agenda_ia/AlarmService.kt
          test -f android/app/src/main/kotlin/com/miagendaia/mi_agenda_ia/AlarmActivity.kt
          test -f android/app/src/main/res/raw/alarm_tone.wav
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' android/app/src/main/AndroidManifest.xml
          grep -q '<service android:name=".AlarmService"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:name=".AlarmActivity"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:showWhenLocked="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:turnScreenOn="true"' android/app/src/main/AndroidManifest.xml
          grep -q '<receiver android:name=".AlarmReceiver"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.WAKE_LOCK' android/app/src/main/AndroidManifest.xml
          echo "Android: OK"

      - name: Resolver dependencias
        script: |
          set -euo pipefail
          flutter pub get
          flutter pub deps --style=compact

      - name: Formatear código
        script: |
          set -euo pipefail
          dart format lib test

      - name: Analizar código
        script: |
          set -euo pipefail
          flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas
        script: |
          set -euo pipefail
          flutter test

      - name: Crear APK instalable
        script: |
          set -euo pipefail
          flutter build apk --debug
          test -f build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk             build/app/outputs/flutter-apk/Mi-Agenda-IA-0.4.2.apk

    artifacts:
      - build/app/outputs/flutter-apk/Mi-Agenda-IA-0.4.2.apk
      - build/app/outputs/flutter-apk/app-debug.apk
